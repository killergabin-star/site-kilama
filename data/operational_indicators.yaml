    status: "Prototype"
    question: "Quels secteurs cumulent simultanément vulnérabilité géopolitique, coût de friend-shoring, chokepoints logistiques, minerais critiques et risque africain ?"
    dataset: "Données internes — méthodologie et sources sur demande"
    coverage: "28 secteurs industriels européens"
    method: "Score composite sur 7 dimensions : GVI, FSCI, Chokepoints, SIS, CMNI, AMAI et GASRI. Un secteur est en triple menace s'il se situe dans le quintile supérieur sur au moins 3 dimensions."
