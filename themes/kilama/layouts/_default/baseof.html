<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" data-palette="{{ with .Params.palette }}{{ . }}{{ else }}{{ if .IsHome }}vivid-bloomberg{{ else if eq .Section "research" }}vivid-bloomberg{{ else if eq .Section "foresight" }}vivid-bloomberg{{ else if eq .Section "policy" }}vivid-editorial{{ else if eq .Section "teaching" }}vivid-editorial{{ else if eq .Section "data" }}vivid-bloomberg{{ else if eq .Section "about" }}vivid-editorial{{ else }}vivid-bloomberg{{ end }}{{ end }}">
<head>
  {{ partial "head.html" . }}
  {{ block "styles" . }}{{ end }}
</head>
<body>

{{ partial "nav.html" . }}

{{ block "main" . }}
  <main>
    {{ .Content }}
  </main>
{{ end }}

{{ partial "footer.html" . }}

<!-- Sticky header scroll detection -->
<script>
(function() {
  var header = document.querySelector('.site-header');
  if (!header) return;
  window.addEventListener('scroll', function() {
    header.classList.toggle('scrolled', window.scrollY > 40);
  });
})();
</script>

{{ block "scripts" . }}{{ end }}

<script src="{{ "js/theme-toggle.js" | relURL }}" defer></script>
</body>
</html>
