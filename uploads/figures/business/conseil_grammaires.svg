<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Inter, Helvetica, Arial, sans-serif">
<rect width="980" height="600" fill="#FFFFFF"/>
<rect x="0" y="0" width="980" height="4" fill="#003366"/>
<text x="40" y="50" font-size="22" font-weight="700" fill="#1F4E79">Quatre grammaires du risque, selon la géographie du siège</text>
<text x="40" y="78" font-size="14" fill="#5B6875">La façon dont les entreprises formulent le risque géopolitique diffère radicalement selon leur ancrage national.</text>
<rect x="40" y="112" width="437" height="192" rx="6" fill="#F7F9FB" stroke="#E1E6EC" stroke-width="1"/>
<rect x="40" y="112" width="5" height="192" rx="2" fill="#1F4E79"/>
<text x="62" y="146" font-size="18" font-weight="700" fill="#22303C">États-Unis</text>
<text x="459" y="145" font-size="11.5" fill="#5B6875" text-anchor="end">73 % du Top 100 mondial</text>
<text x="62" y="172" font-size="14" font-weight="700" fill="#1F4E79" letter-spacing="0.3">Hégémonie &amp; sécurité nationale</text>
<text x="62" y="198" font-size="13" fill="#22303C">Le risque est lu comme une menace à la primauté</text>
<text x="62" y="220" font-size="13" fill="#22303C">américaine et à la sécurité nationale :</text>
<text x="62" y="242" font-size="13" fill="#22303C">contrôles à l'exportation, dépendances</text>
<text x="62" y="264" font-size="13" fill="#22303C">stratégiques, rivalité de puissance.</text>
<rect x="503.0" y="112" width="437" height="192" rx="6" fill="#F7F9FB" stroke="#E1E6EC" stroke-width="1"/>
<rect x="503.0" y="112" width="5" height="192" rx="2" fill="#3E6DA3"/>
<text x="525" y="146" font-size="18" font-weight="700" fill="#22303C">Europe</text>
<text x="922" y="145" font-size="11.5" fill="#5B6875" text-anchor="end">Prise en étau Washington–Pékin</text>
<text x="525" y="172" font-size="14" font-weight="700" fill="#3E6DA3" letter-spacing="0.3">Lecture normative</text>
<text x="525" y="198" font-size="13" fill="#22303C">Érosion de l'état de droit et du multilatéralisme,</text>
<text x="525" y="220" font-size="13" fill="#22303C">imprévisibilité réglementaire. La relation</text>
<text x="525" y="242" font-size="13" fill="#22303C">transatlantique est décrite comme centrale</text>
<text x="525" y="264" font-size="13" fill="#22303C">et comme source d'incertitude croissante.</text>
<rect x="40" y="330" width="437" height="192" rx="6" fill="#F7F9FB" stroke="#E1E6EC" stroke-width="1"/>
<rect x="40" y="330" width="5" height="192" rx="2" fill="#C0392B"/>
<text x="62" y="364" font-size="18" font-weight="700" fill="#22303C">Chine</text>
<text x="459" y="363" font-size="11.5" fill="#5B6875" text-anchor="end">Alignement sur le Parti</text>
<text x="62" y="390" font-size="14" font-weight="700" fill="#C0392B" letter-spacing="0.3">Conformité idéologique</text>
<text x="62" y="416" font-size="13" fill="#22303C">Le discours de risque s'aligne explicitement sur</text>
<text x="62" y="438" font-size="13" fill="#22303C">les priorités du Parti : la conformité idéologique</text>
<text x="62" y="460" font-size="13" fill="#22303C">est un pilier à part entière de la gestion</text>
<text x="62" y="482" font-size="13" fill="#22303C">des risques.</text>
<rect x="503.0" y="330" width="437" height="192" rx="6" fill="#F7F9FB" stroke="#E1E6EC" stroke-width="1"/>
<rect x="503.0" y="330" width="5" height="192" rx="2" fill="#1E7A6B"/>
<text x="525" y="364" font-size="18" font-weight="700" fill="#22303C">Inde</text>
<text x="922" y="363" font-size="11.5" fill="#5B6875" text-anchor="end">Multi-alignement assumé</text>
<text x="525" y="390" font-size="14" font-weight="700" fill="#1E7A6B" letter-spacing="0.3">Opportunité structurelle</text>
<text x="525" y="416" font-size="13" fill="#22303C">La recomposition de l'ordre mondial est lue</text>
<text x="525" y="438" font-size="13" fill="#22303C">comme une opportunité — posture rendue</text>
<text x="525" y="460" font-size="13" fill="#22303C">possible par un multi-alignement</text>
<text x="525" y="482" font-size="13" fill="#22303C">diplomatique assumé.</text>
<line x1="40" y1="560" x2="940" y2="560" stroke="#E1E6EC" stroke-width="1"/>
<text x="40" y="580" font-size="11.5" fill="#5B6875">Source : d'après Thomas Gomart et Lucie Mielle, « Que craignent les entreprises ? Nouvelle géographie du risque géopolitique », Études de l'Ifri, mai 2026.</text>
<text x="940" y="580" font-size="11.5" font-weight="600" fill="#1F4E79" text-anchor="end">erickilama.com</text>
</svg>